# Food-equity pack (track 1 default). Synthetic data for a fictional "Harbor County".
# Golden numbers for this pack are ENGINE-COMPUTED (tests pin them), not hand-calculated.
meta:
  id: food_equity
  title: "Harbor County food relief: 16 zones, 8 lots, 2 depots"
  track: food_equity
  disclaimer: "Synthetic data for a fictional county. Weights are policy choices, not facts."

entities:
  zones:
    table: zones
    columns:
      need: need_units
      vulnerability: vulnerability_index
      deadline_h: deadline_hours
      capacity: capacity_units
      handling: handling_supported
      served: served_units
    extra: [no_vehicle_share]
  lots:
    table: supply_lots
    columns:
      quantity: quantity_remaining
      expiry_h: expiry_hours
      lat: origin_lat
      lon: origin_lon
  eligibility:
    table: eligibility
  conditions:
    table: conditions

scoring:
  - {term: vulnerability, weight: 0.40, params: {label: "neighbourhood vulnerability"}}
  - {term: urgency, weight: 0.25, params: {horizon_h: 72, label: "deadline urgency"}}
  - {term: need_share, weight: 0.15, params: {label: "size of unmet need"}}
  - {term: attr_share, weight: 0.10, params: {column: no_vehicle_share, label: "households without a car"}}
  - {term: condition, weight: 0.10, params: {factor: hazard, label: "storm risk"}}

constraints:
  - {name: handling}
  - {name: expiry, params: {safety_margin_h: 0.25}}
  - {name: deadline}
  - {name: eligibility}

strategy:
  name: fair_lp
  params: {alpha: 0.25, lambda_perishable: 1.0}
  baselines: [nearest_first, fcfs, priority_greedy]

travel: {mode: haversine, speed_kmh: 30}

conditions:
  provider: static
  max_age_minutes: 720

vocabulary: {zone: neighbourhood, zones: neighbourhoods, unit: food boxes, lot: lot}

metrics:
  headline: vwu
