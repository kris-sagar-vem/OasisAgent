# The worked example from PREP_GUIDE section 3. Its numbers are hand-calculated there.
meta:
  id: toy
  title: "Worked example: 4 zones, 2 lots (PREP_GUIDE section 3)"
  track: food_equity
  disclaimer: "Synthetic teaching data. Weights are policy choices, not facts."

entities:
  zones:
    table: zones
    columns:
      need: need_units
      vulnerability: vulnerability_index
      deadline_h: deadline_hours
      capacity: capacity_units
      handling: handling_supported
      served: served_units
  lots:
    table: supply_lots
    columns:
      quantity: quantity_remaining
      expiry_h: expiry_hours
      lat: origin_lat
      lon: origin_lon
  travel:
    table: travel

scoring:
  - {term: vulnerability, weight: 0.5}
  - {term: urgency, weight: 0.3, params: {horizon_h: 72}}
  - {term: need_share, weight: 0.2}

constraints:
  - {name: handling}
  - {name: expiry}
  - {name: deadline}

strategy:
  name: priority_greedy
  baselines: [nearest_first, fcfs]

travel: {mode: table}

vocabulary: {zone: zone, zones: zones, unit: units, lot: lot}

metrics:
  headline: vwu
